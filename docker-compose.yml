# Reproducible, containerised stack for PawfectHome — one command brings up MongoDB, the API and the
# web app the same way on any machine:  docker compose up --build
#
# Secrets are read from backend/.env (kept out of version control; see backend/.env.example). Only
# the values that must differ inside the network are overridden below.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # Deliberately NOT published to the host — only the API (on the internal network) may reach it.

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      # Point at the in-network Mongo service rather than whatever the .env holds for local dev.
      MONGODB_URI: mongodb://mongo:27017/pawfecthome
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - mongo
    ports:
      - "5000:5000"

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  mongo-data:
